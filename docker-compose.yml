x-app-env: &app-env
  ENVIRONMENT: development
  DATABASE_URL: postgresql+psycopg://teamflow:teamflow_pass@db:5432/teamflow
  SECRET_KEY: local-docker-dev-secret-key-0123456789abcdef
  FRONTEND_URL: http://localhost:3000
  REDIS_URL: redis://redis:6379/0
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_USE_TLS: "false"
  EMAIL_FROM: "TeamFlow <no-reply@teamflow.local>"

services:
  db:
    image: postgres:16
    container_name: teamflow_db
    environment:
      POSTGRES_USER: teamflow
      POSTGRES_PASSWORD: teamflow_pass
      POSTGRES_DB: teamflow
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamflow -d teamflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: teamflow_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: teamflow_mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # واجهة الويب

  api:
    build: .
    container_name: teamflow_api
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      <<: *app-env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build: .
    container_name: teamflow_worker
    command: celery -A app.core.celery_app worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      <<: *app-env

volumes:
  pgdata: