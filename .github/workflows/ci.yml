name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: teamflow
          POSTGRES_PASSWORD: teamflow_pass
          POSTGRES_DB: teamflow
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check app tests

      - name: Setup test database
        run: |
          PGPASSWORD=teamflow_pass psql -h localhost -p 5433 -U teamflow -d teamflow -c "CREATE DATABASE teamflow_test;"

      - name: Check Alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg://teamflow:teamflow_pass@localhost:5433/teamflow
          SECRET_KEY: test-secret-key-at-least-32-chars-long!
        run: |
          alembic upgrade head
          alembic check

      - name: Run pytest
        env:
          DATABASE_URL: postgresql+psycopg://teamflow:teamflow_pass@localhost:5433/teamflow
          SECRET_KEY: test-secret-key-at-least-32-chars-long!
        run: |
          pytest -v